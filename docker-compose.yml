version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: amaru_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: amaru_db
      POSTGRES_USER: amaru_admin
      POSTGRES_PASSWORD: secure_password_123 # En producción esto se inyecta por AWS Secrets / .env
    ports:
      - "5432:5432"
    volumes:
      - amaru_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amaru_admin -d amaru_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amaru_pg_data:

